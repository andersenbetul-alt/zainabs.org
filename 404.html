<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Sayfa bulunamadı | ZAINAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/icon-192.png">
<style>
:root{--plum:#452568;--plum-2:#7851A9;--mist:#F5F0FA;--ink:#28212D;--muted:#685f78}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--mist);color:var(--ink);font:17px/1.6 'Manrope',system-ui,sans-serif;text-align:center;padding:24px}
.box{max-width:480px}
h1{font-family:'Playfair Display',Georgia,serif;color:var(--plum);font-size:clamp(2rem,6vw,2.8rem);margin:0 0 12px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;background:var(--plum);color:#fff;text-decoration:none;padding:13px 26px;border-radius:100px;font-weight:600;min-height:44px;line-height:18px}
a:hover{background:var(--plum-2)}
</style>
</head>
<body>
<div class="box">
<h1>Bu sayfa bulunamadı.</h1>
<p>Aradığınız adres taşınmış veya hiç var olmamış olabilir. ZAINAB tek sayfalık bir sitedir — aradığınız içerik muhtemelen ana sayfadaki bölümlerden birinde.</p>
<a href="/">Ana sayfaya dön →</a>
</div>
</body>
</html>
